<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d"><title id="t">DefectRAG inspection and question pipelines</title><desc id="d">Step by step: how a photo becomes a heatmap and verdict, and how a question becomes a cited answer or an abstention in the LangGraph workflow.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs><rect x="0.5" y="0.5" width="1199" height="759" rx="18" fill="#ffffff" stroke="#e5e7eb"/><text x="40" y="48" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">DefectRAG · Request pipelines</text><text x="40" y="72" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">What happens to one photo and one question. Code names match backend/highres.py and backend/rag.py.</text><rect x="30" y="100" width="1140" height="230" rx="14" fill="#0891b2" fill-opacity="0.07" stroke="#0891b2" stroke-opacity="0.55" stroke-width="1.2"/><rect x="46" y="114" width="6" height="18" rx="3" fill="#0891b2"/><text x="60" y="128" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0891b2" text-anchor="start" letter-spacing="1.2">1 · INSPECT A PHOTO</text><text x="1154" y="128" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="end">backend/highres.py</text><rect x="48" y="150" width="162" height="96" rx="9" fill="#ffffff" stroke="#0891b2" stroke-opacity="0.8" stroke-width="1.3"/><rect x="48" y="150" width="4" height="96" rx="2" fill="#0891b2"/><text x="131.0" y="186.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="650" fill="#0f172a" text-anchor="middle">Photo</text><text x="131.0" y="205.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">any size, any product</text><text x="131.0" y="221.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">upload checks</text><rect x="234" y="150" width="162" height="96" rx="9" fill="#ffffff" stroke="#0891b2" stroke-opacity="0.8" stroke-width="1.3"/><rect x="234" y="150" width="4" height="96" rx="2" fill="#0891b2"/><text x="317.0" y="186.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="650" fill="#0f172a" text-anchor="middle">Resize</text><text x="317.0" y="205.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">short edge 448 px</text><text x="317.0" y="221.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">3:2 → 32 × 48 patches</text><rect x="420" y="150" width="162" height="96" rx="9" fill="#ffffff" stroke="#0891b2" stroke-opacity="0.8" stroke-width="1.3"/><rect x="420" y="150" width="4" height="96" rx="2" fill="#0891b2"/><text x="503.0" y="186.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="650" fill="#0f172a" text-anchor="middle">DINOv2 encoder</text><text x="503.0" y="205.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">1,536 patch vectors</text><text x="503.0" y="221.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">fine-tuned on VisA</text><rect x="606" y="150" width="162" height="96" rx="9" fill="#ffffff" stroke="#0891b2" stroke-opacity="0.8" stroke-width="1.3"/><rect x="606" y="150" width="4" height="96" rx="2" fill="#0891b2"/><text x="689.0" y="186.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="650" fill="#0f172a" text-anchor="middle">Foreground mask</text><text x="689.0" y="205.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">PCA on patch features</text><text x="689.0" y="221.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">ignores background</text><rect x="792" y="150" width="162" height="96" rx="9" fill="#ffffff" stroke="#0891b2" stroke-opacity="0.8" stroke-width="1.3"/><rect x="792" y="150" width="4" height="96" rx="2" fill="#0891b2"/><text x="875.0" y="186.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="650" fill="#0f172a" text-anchor="middle">Nearest neighbour</text><text x="875.0" y="205.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">each patch vs memory</text><text x="875.0" y="221.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">32,768 normal patches</text><rect x="978" y="150" width="162" height="96" rx="9" fill="#ffffff" stroke="#0891b2" stroke-opacity="0.8" stroke-width="1.3"/><rect x="978" y="150" width="4" height="96" rx="2" fill="#0891b2"/><text x="1061.0" y="186.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="650" fill="#0f172a" text-anchor="middle">Score + verdict</text><text x="1061.0" y="205.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">heatmap = patch gaps</text><text x="1061.0" y="221.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">score vs product limit</text><path d="M210,198 L232,198" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)" stroke-linejoin="round"/><path d="M396,198 L418,198" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)" stroke-linejoin="round"/><path d="M582,198 L604,198" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)" stroke-linejoin="round"/><path d="M768,198 L790,198" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)" stroke-linejoin="round"/><path d="M954,198 L976,198" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)" stroke-linejoin="round"/><text x="748" y="290" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">Result:</text><rect x="760" y="276" width="60" height="21" rx="10.5" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a"/><text x="790.0" y="291" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#16a34a" text-anchor="middle">normal</text><rect x="830" y="276" width="95" height="21" rx="10.5" fill="#d97706" fill-opacity="0.15" stroke="#d97706"/><text x="877.5" y="291" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#d97706" text-anchor="middle">closer look</text><rect x="935" y="276" width="67" height="21" rx="10.5" fill="#dc2626" fill-opacity="0.15" stroke="#dc2626"/><text x="968.5" y="291" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#dc2626" text-anchor="middle">unusual</text><text x="48" y="290" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">The limit is the 95th percentile of held-out normal scores; nothing defective is used to set it.</text><text x="48" y="310" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Closer look = within 5% of the limit, so borderline photos go to a person.</text><rect x="30" y="360" width="1140" height="370" rx="14" fill="#d97706" fill-opacity="0.07" stroke="#d97706" stroke-opacity="0.55" stroke-width="1.2"/><rect x="46" y="374" width="6" height="18" rx="3" fill="#d97706"/><text x="60" y="388" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#d97706" text-anchor="start" letter-spacing="1.2">2 · ASK A QUESTION</text><text x="1154" y="388" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="end">LangGraph StateGraph · backend/rag.py</text><rect x="48" y="420" width="140" height="70" rx="9" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.8" stroke-width="1.3"/><rect x="48" y="420" width="4" height="70" rx="2" fill="#2563eb"/><text x="120.0" y="451.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="650" fill="#0f172a" text-anchor="middle">Question</text><text x="120.0" y="470.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">+ linked inspection</text><rect x="224" y="420" width="150" height="70" rx="9" fill="#ffffff" stroke="#d97706" stroke-opacity="0.8" stroke-width="1.3"/><rect x="224" y="420" width="4" height="70" rx="2" fill="#d97706"/><text x="301.0" y="451.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="650" fill="#0f172a" text-anchor="middle">Measurement?</text><text x="301.0" y="470.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">score, limit, verdict</text><rect x="224" y="560" width="150" height="70" rx="9" fill="#ffffff" stroke="#16a34a" stroke-opacity="0.8" stroke-width="1.3"/><rect x="224" y="560" width="4" height="70" rx="2" fill="#16a34a"/><text x="301.0" y="591.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="650" fill="#0f172a" text-anchor="middle">Saved facts</text><text x="301.0" y="610.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">no LLM, exact values</text><rect x="410" y="420" width="140" height="70" rx="9" fill="#ffffff" stroke="#d97706" stroke-opacity="0.8" stroke-width="1.3"/><rect x="410" y="420" width="4" height="70" rx="2" fill="#d97706"/><text x="482.0" y="451.0" font-family="Cascadia Code,Consolas,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="650" fill="#0f172a" text-anchor="middle">route</text><text x="482.0" y="470.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">scope check</text><rect x="560" y="420" width="140" height="70" rx="9" fill="#ffffff" stroke="#d97706" stroke-opacity="0.8" stroke-width="1.3"/><rect x="560" y="420" width="4" height="70" rx="2" fill="#d97706"/><text x="632.0" y="451.0" font-family="Cascadia Code,Consolas,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="650" fill="#0f172a" text-anchor="middle">retrieve</text><text x="632.0" y="470.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">BGE top-3 ≥ 0.50</text><rect x="710" y="420" width="140" height="70" rx="9" fill="#ffffff" stroke="#d97706" stroke-opacity="0.8" stroke-width="1.3"/><rect x="710" y="420" width="4" height="70" rx="2" fill="#d97706"/><text x="782.0" y="451.0" font-family="Cascadia Code,Consolas,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="650" fill="#0f172a" text-anchor="middle">validate_evidence</text><text x="782.0" y="470.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">source, licence</text><rect x="860" y="420" width="140" height="70" rx="9" fill="#ffffff" stroke="#d97706" stroke-opacity="0.8" stroke-width="1.3"/><rect x="860" y="420" width="4" height="70" rx="2" fill="#d97706"/><text x="932.0" y="451.0" font-family="Cascadia Code,Consolas,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="650" fill="#0f172a" text-anchor="middle">generate</text><text x="932.0" y="470.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">Qwen2.5-3B QLoRA</text><rect x="1010" y="420" width="142" height="70" rx="9" fill="#ffffff" stroke="#d97706" stroke-opacity="0.8" stroke-width="1.3"/><rect x="1010" y="420" width="4" height="70" rx="2" fill="#d97706"/><text x="1083.0" y="451.0" font-family="Cascadia Code,Consolas,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="650" fill="#0f172a" text-anchor="middle">validate_answer</text><text x="1083.0" y="470.0" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">quote, numbers</text><path d="M188,455 L224,455" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)" stroke-linejoin="round"/><path d="M374,455 L410,455" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)" stroke-linejoin="round"/><rect x="382.4" y="432" width="19.2" height="17" rx="8.5" fill="#f1f5f9" stroke="#e5e7eb"/><text x="392" y="445" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#475569" text-anchor="middle">no</text><path d="M299,490 L299,560" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)" stroke-linejoin="round"/><rect x="286.35" y="514" width="25.299999999999997" height="17" rx="8.5" fill="#f1f5f9" stroke="#e5e7eb"/><text x="299" y="527" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#475569" text-anchor="middle">yes</text><path d="M550,455 L560,455" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)" stroke-linejoin="round"/><path d="M700,455 L710,455" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)" stroke-linejoin="round"/><path d="M850,455 L860,455" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)" stroke-linejoin="round"/><path d="M1000,455 L1010,455" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)" stroke-linejoin="round"/><rect x="560" y="575" width="290" height="62" rx="9" fill="#dc2626" fill-opacity="0.10" stroke="#dc2626" stroke-width="1.3"/><text x="705" y="600" font-family="Cascadia Code,Consolas,SFMono-Regular,Menlo,monospace" font-size="13.5" font-weight="650" fill="#dc2626" text-anchor="middle">abstain</text><text x="705" y="620" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">“The documentation does not establish that claim.”</text><path d="M480,490 L480,606 L560,606" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#stop)" stroke-linejoin="round"/><rect x="397.2" y="534" width="165.6" height="17" rx="8.5" fill="#f1f5f9" stroke="#e5e7eb"/><text x="480" y="547" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#dc2626" text-anchor="middle">root cause, repair, count…</text><path d="M780,490 L780,575" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#stop)" stroke-linejoin="round"/><rect x="727.7" y="521" width="104.6" height="17" rx="8.5" fill="#f1f5f9" stroke="#e5e7eb"/><text x="780" y="534" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#dc2626" text-anchor="middle">no evidence left</text><rect x="910" y="575" width="242" height="62" rx="9" fill="#16a34a" fill-opacity="0.10" stroke="#16a34a" stroke-width="1.3"/><text x="1031" y="600" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="650" fill="#16a34a" text-anchor="middle">Cited answer</text><text x="1031" y="620" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">claim + exact quote + source link</text><path d="M1081,490 L1081,575" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ok)" stroke-linejoin="round"/><rect x="1059.2" y="521" width="43.599999999999994" height="17" rx="8.5" fill="#f1f5f9" stroke="#e5e7eb"/><text x="1081" y="534" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#475569" text-anchor="middle">passes</text><text x="1031" y="662" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">If no claim passes: show the retrieved</text><text x="1031" y="677" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">sentences only (retrieval-only mode)</text><text x="48" y="700" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">The model only picks which retrieved sentence answers the question and restates it; code checks that</text><text x="48" y="717" font-family="Segoe UI,Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">the quote exists word for word in the source and that every number in the answer appears in that quote.</text></svg>
